name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_run_id:
        description: 'Successful Documentation CI run to publish (empty deploys production)'
        type: string
        required: false
  workflow_run:
    workflows: [Documentation CI]
    types: [completed]
  # Cleanup only: never check out or execute the pull request's source here.
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

# Production and previews share one Pages site and one storage branch.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      action: ${{ steps.context.outputs.action }}
      pr: ${{ steps.context.outputs.pr }}
      sha: ${{ steps.context.outputs.sha }}
      run-id: ${{ steps.context.outputs.run-id }}
    steps:
      - name: Checkout trusted deployment scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'main' }}
          persist-credentials: false

      - name: Check trusted deployment scripts
        run: node --test .github/scripts/previews.test.cjs

      - name: Resolve current pull request
        id: context
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { resolve } = require('./.github/scripts/previews.cjs');
            await resolve({ github, context, core });

  build:
    needs: context
    if: contains(fromJSON('["production", "preview", "remove"]'), needs.context.outputs.action)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current production source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check production Markdown
        # The initial bootstrap builds the unchanged main source; PR lint already passed in CI.
        if: github.event_name != 'workflow_dispatch' || inputs.preview_run_id == ''
        run: npm run lint:md

      - name: Build production
        run: npm run build

      - name: Upload production
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-production
          path: build
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [context, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      published: ${{ steps.prepare.outputs.publish }}
      page-url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout trusted deployment scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'main' }}

      - name: Download production
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-production
          path: site

      - name: Download compiled preview from CI
        if: needs.context.outputs.action == 'preview'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-preview
          path: incoming
          run-id: ${{ needs.context.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Restore existing previews
        shell: bash
        run: |
          preview_ref=$(git ls-remote --heads origin gh-pages)
          if [[ -n "$preview_ref" ]]; then
            git fetch --depth=1 origin gh-pages
            if git cat-file -e FETCH_HEAD:pr-preview 2>/dev/null; then
              git archive FETCH_HEAD pr-preview | tar -xf - -C site
            fi
          fi

      - name: Update previews and remove closed pull requests
        id: prepare
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PREVIEW_ACTION: ${{ needs.context.outputs.action }}
          PREVIEW_PR: ${{ needs.context.outputs.pr }}
          PREVIEW_SHA: ${{ needs.context.outputs.sha }}
        with:
          script: |
            const { prepare } = require('./.github/scripts/previews.cjs');
            await prepare({ github, context, core });

      - name: Save production and previews for future deployments
        if: steps.prepare.outputs.publish == 'true'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          branch: gh-pages
          folder: site
          clean: true
          commit-message: 'ci: update documentation and pull request previews'

      - name: Upload Pages artifact
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.prepare.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  comment:
    needs: [context, build, deploy]
    if: always() && needs.context.outputs.pr != '' && needs.context.outputs.action != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted comment script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'main' }}
          persist-credentials: false

      - name: Update preview comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PREVIEW_ACTION: ${{ needs.context.outputs.action }}
          PREVIEW_PR: ${{ needs.context.outputs.pr }}
          PREVIEW_SHA: ${{ needs.context.outputs.sha }}
          PREVIEW_RUN_ID: ${{ needs.context.outputs.run-id }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PREVIEW_PUBLISHED: ${{ needs.deploy.outputs.published }}
          PAGES_URL: ${{ needs.deploy.outputs.page-url }}
        with:
          script: |
            const { comment } = require('./.github/scripts/previews.cjs');
            await comment({ github, context });
